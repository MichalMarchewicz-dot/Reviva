<style>
  /* --- FINALNA KONFIGURACJA V14 (WHITE PLACEHOLDER FIX) --- */
  @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@400;700&family=Unbounded:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --ksfy-green: #00ff7f;
    --ksfy-glass: rgba(15, 15, 15, 0.8);
    --ksfy-border: rgba(0, 255, 127, 0.4);
  }

  /* RESET ZAZNACZANIA */
  .ksfy-footer-v14 *::selection {
    background-color: var(--ksfy-green) !important;
    color: #000000 !important;
    -webkit-text-fill-color: #000000 !important;
  }

  .ksfy-footer-v14 {
    position: relative;
    background: #000000;
    padding: 80px 0 40px;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    border: none !important;
  }

  /* SEKCJA LOGO */
  .footer-brand-top {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 60px;
  }

  .brand-wrapper-v14 {
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    filter: blur(10px);
    transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .is-visible .brand-wrapper-v14 {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }

  .logo-footer-main {
    font-family: 'Syncopate', sans-serif !important;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 55px);
    color: #ffffff;
    letter-spacing: 0.25em;
    margin: 0;
    text-transform: uppercase;
  }

  .logo-footer-sub {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 400;
    font-size: 11px;
    color: var(--ksfy-green);
    letter-spacing: 1em;
    margin-top: 12px;
    text-transform: uppercase;
    display: block;
    text-indent: 1em;
  }

  .brand-wrapper-v14::after {
    content: '';
    display: block;
    width: 0;
    height: 2px;
    background: var(--ksfy-green);
    margin: 20px auto 0;
    box-shadow: 0 0 15px var(--ksfy-green);
    transition: width 1s ease-out 0.6s;
  }

  .is-visible .brand-wrapper-v14::after {
    width: 50px;
  }

  /* UKŁAD STOPKI */
  .ksfy-footer-container {
    position: relative; z-index: 2; 
    width: 90%; max-width: 1100px;
    margin: 0 auto;
    display: flex; flex-direction: column; gap: 50px;
  }

  .ksfy-split-layout {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
  }

  /* DOKUMENTACJA */
  .ksfy-links-stack {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }

  .ksfy-mini-capsule {
    background: var(--ksfy-glass);
    border: 1px solid var(--ksfy-border);
    border-radius: 100px; padding: 10px 25px;
    display: flex; justify-content: center; text-decoration: none;
    transition: 0.3s all ease; backdrop-filter: blur(10px);
    min-width: 220px;
  }

  .ksfy-mini-capsule:hover {
    border-color: var(--ksfy-green); transform: translateY(-3px);
    box-shadow: 0 0 15px rgba(0, 255, 127, 0.2);
  }

  .ksfy-link-text {
    font-family: 'Unbounded', sans-serif;
    font-size: 10px; font-weight: 700; color: #fff;
    text-transform: uppercase; letter-spacing: 1px;
  }

  /* NEWSLETTER & WHITE PLACEHOLDER FIX */
  .ksfy-news-section {
    display: flex; flex-direction: column; align-items: center; gap: 15px;
  }

  .ksfy-label-v14 {
    font-family: 'Unbounded', sans-serif;
    font-size: 9px; color: #fff; text-transform: uppercase; 
    letter-spacing: 2px; opacity: 0.7; text-align: center;
  }

  .ksfy-capsule-input {
    background: var(--ksfy-glass); border: 1px solid var(--ksfy-border);
    border-radius: 100px; padding: 8px 10px 8px 25px;
    display: flex; align-items: center; gap: 10px;
    backdrop-filter: blur(10px);
  }

  .ksfy-input-v14 {
    background: transparent !important; border: none !important; 
    color: #ffffff !important; font-size: 13px; outline: none !important; width: 180px;
  }

  /* WYMUSZENIE BIAŁEGO KOLORU DLA NAPISU "ADRES E-MAIL..." */
  .ksfy-input-v14::placeholder {
    color: #ffffff !important;
    opacity: 1 !important; /* Shopify/Chrome czasem obniża opacity */
  }
  .ksfy-input-v14::-webkit-input-placeholder {
    color: #ffffff !important;
    opacity: 1 !important;
  }
  .ksfy-input-v14::-moz-placeholder {
    color: #ffffff !important;
    opacity: 1 !important;
  }
  .ksfy-input-v14:-ms-input-placeholder {
    color: #ffffff !important;
    opacity: 1 !important;
  }

  .ksfy-btn-v14 {
    background: var(--ksfy-green); border: none; border-radius: 50px;
    padding: 10px 20px; font-family: 'Unbounded', sans-serif;
    font-size: 9px; font-weight: 800; color: #000;
    cursor: pointer; transition: 0.3s; text-transform: uppercase;
  }

  /* DOLNY PASEK */
  .ksfy-bottom-v14 {
    width: 100%; display: flex; justify-content: space-between;
    align-items: center; padding-top: 25px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .ksfy-white-tech {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #ffffff !important;
  }

  /* ŚNIEG */
  .ksfy-snow-v14 {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  .ksfy-flake-v14 {
    position: absolute; background: #fff; border-radius: 50%; opacity: 0.3;
    animation: ksfyFallV14 linear infinite;
  }
  @keyframes ksfyFallV14 { to { transform: translateY(450px); } }

  /* MOBILE */
  @media (max-width: 850px) {
    .ksfy-split-layout { flex-direction: column-reverse; gap: 40px; }
    .ksfy-capsule-input {
      flex-direction: column; border-radius: 30px; padding: 20px;
      width: 100%; max-width: 340px;
    }
    .ksfy-input-v14 { width: 100%; text-align: center; }
    .ksfy-btn-v14 { width: 100%; }
    .footer-brand-top { margin-bottom: 40px; }
  }
</style>

<footer class="ksfy-footer-v14" id="ksfy-footer-trigger">
  <div id="ksfySnowV14" class="ksfy-snow-v14"></div>

  <div class="footer-brand-top">
    <div class="brand-wrapper-v14">
      <h2 class="logo-footer-main">KURSIFY</h2>
      <span class="logo-footer-sub">Est 2025</span>
    </div>
  </div>

  <div class="ksfy-footer-container">
    <div class="ksfy-split-layout">
      
      <div class="ksfy-links-stack">
        <div class="ksfy-label-v14">// ZAKŁADKI</div>
        <a href="/policies/privacy-policy" class="ksfy-mini-capsule"><span class="ksfy-link-text">Polityka prywatności</span></a>
        <a href="/policies/refund-policy" class="ksfy-mini-capsule"><span class="ksfy-link-text">Polityka zwrotu kosztów</span></a>
        <a href="/policies/contact-information" class="ksfy-mini-capsule"><span class="ksfy-link-text">Dane kontaktowe</span></a>
      </div>

      <div class="ksfy-news-section">
        <div class="ksfy-label-v14">// NEWSLETTER</div>
        {%- form 'customer' -%}
          <input type="hidden" name="contact[tags]" value="newsletter">
          <div class="ksfy-capsule-input">
            <input id="NewsletterForm-{{ section.id }}" type="email" name="contact[email]" class="ksfy-input-v14" value="{{ form.email }}" placeholder="Adres e-mail..." required>
            <button type="submit" class="ksfy-btn-v14" name="commit">ZAPISZ MNIE</button>
          </div>
          {%- if form.posted_successfully? -%}
            <p style="color: var(--ksfy-green); font-size: 11px; margin-top: 10px; font-family: 'Unbounded'; text-align: center;">Sukces! Zostałeś zapisany.</p>
          {%- endif -%}
        {%- endform -%}
      </div>
    </div>

    <div class="ksfy-bottom-v14">
      <div class="ksfy-white-tech">© 2026 KURSIFY • CORE_V.20</div>
      <div class="ksfy-white-tech">EST. 2025 // STATUS: <span style="color:var(--ksfy-green); font-weight:bold; text-shadow: 0 0 10px var(--ksfy-green);">ONLINE</span></div>
    </div>
  </div>
</footer>

<script>
  (function() {
    const observerOptions = { threshold: 0.1 };
    const footerObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        }
      });
    }, observerOptions);

    const target = document.querySelector('#ksfy-footer-trigger');
    if (target) footerObserver.observe(target);

    const snowV14 = document.getElementById('ksfySnowV14');
    for (let i = 0; i < 30; i++) {
      const flake = document.createElement('div');
      flake.className = 'ksfy-flake-v14';
      const size = Math.random() * 2 + 1 + 'px';
      flake.style.width = size; flake.style.height = size;
      flake.style.left = Math.random() * 100 + '%';
      flake.style.animationDuration = Math.random() * 3 + 4 + 's';
      flake.style.animationDelay = Math.random() * 5 + 's';
      flake.style.top = '-10px';
      snowV14.appendChild(flake);
    }
  })();
</script>
